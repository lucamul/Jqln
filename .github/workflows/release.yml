name: Release

# Fires only when a pull request labelled `release` is merged into main (the
# Release-prep workflow opens and labels that PR), or when dispatched by hand.
# It builds binaries for the supported targets and publishes a GitHub Release
# whose tag is created from Cargo.toml's version. No personal access token is
# needed — the release's tag is created by the publish step.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release — must equal Cargo.toml on main (e.g. 0.1.0)."
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'release'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
      go: ${{ steps.v.outputs.go }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - id: v
        run: |
          version=$(grep -m1 -E '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "${{ github.event_name }}" = workflow_dispatch ] \
             && [ "${{ inputs.version }}" != "$version" ]; then
            echo "::error::input '${{ inputs.version }}' != Cargo.toml '$version'"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already tagged — nothing to release."
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin,       os: macos-13 }
          - { target: aarch64-apple-darwin,      os: macos-latest }
          - { target: x86_64-pc-windows-msvc,    os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          v="${{ needs.check.outputs.version }}"
          name="jqln-$v-${{ matrix.target }}"
          mkdir "$name"
          bin=jqln
          [ "$RUNNER_OS" = Windows ] && bin=jqln.exe
          cp "target/${{ matrix.target }}/release/$bin" \
             LICENSE THIRD-PARTY-NOTICES README.md CHANGELOG.md "$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: jqln-${{ matrix.target }}
          path: |
            jqln-*.tar.gz
            jqln-*.zip

  publish:
    needs: [check, build]
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        run: |
          v="${{ needs.check.outputs.version }}"
          (cd dist && sha256sum jqln-* > SHA256SUMS)
          awk -v ver="$v" \
            '$0 ~ "^## \\[" ver "\\]" {f=1; next} f && /^## \[/ {exit} f' \
            CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release v$v" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ needs.check.outputs.sha }}
          name: v${{ needs.check.outputs.version }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
