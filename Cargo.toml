[package]
name = "jqln"
version = "1.2.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal-native writing studio for long-form prose"
license-file = "LICENSE"
readme = "README.md"
publish = false

[features]
default = ["assistant"]
# The AI assistant panel. Built in by default but inert until you launch with
# `jqln --with-ai-assistant`. Package a lean, offline, dependency-light binary
# with `--no-default-features`.
assistant = ["dep:ureq", "dep:serde_json"]

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
spellbook = "0.4.2"
toml = "1.1.4"
tui-textarea-2 = { version = "0.13", default-features = false, features = ["crossterm", "search"] }

# --- assistant feature only ---
ureq = { version = "2.12", default-features = false, features = ["tls"], optional = true }
serde_json = { version = "1.0", optional = true }
