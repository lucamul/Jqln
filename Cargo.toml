[package]
name = "jqln"
version = "1.2.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal-native writing studio for long-form prose"
license-file = "LICENSE"
readme = "README.md"
publish = false

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
spellbook = "0.4.2"
toml = "1.1.4"
tui-textarea-2 = { version = "0.13", default-features = false, features = ["crossterm", "search"] }
