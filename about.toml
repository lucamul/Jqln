# Config for `cargo about` — regenerates THIRD-PARTY-NOTICES.
#
#   cargo install cargo-about --features cli
#   cargo about generate about.hbs -o THIRD-PARTY-NOTICES

ignore-build-dependencies = true
ignore-dev-dependencies = true

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Unlicense",
    # pulled in only by the `assistant` feature (ureq → rustls → ring → …)
    "CDLA-Permissive-2.0",
    "OpenSSL",
]

# Jqln itself (publish = false) is not a third-party component.
[private]
ignore = true
